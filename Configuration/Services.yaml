services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    DMK\Mkcleaner\:
      resource: '../Classes/*'

    DMK\Mkcleaner\EventListener\UploadedFileEventListener:
        tags:
            - name: event.listener
              identifier: 'AddFileEventListener'
              method: 'cleanUpFile'
              event: TYPO3\CMS\Core\Resource\Event\AfterFileAddedEvent
            - name: event.listener
              identifier: 'ReplacedFileEventListener'
              method: 'cleanUpFile'
              event: TYPO3\CMS\Core\Resource\Event\AfterFileReplacedEvent
